# Armbian build config — NanoPi M1, Debian trixie, current kernel
# Replicates the latest image (md5 d9422649) + forensic hooks via userpatches/customize-image.sh

BOARD=nanopim1
BRANCH=current
RELEASE=trixie
BUILD_MINIMAL=yes
KERNEL_CONFIGURE=no
EXTRAWIFI=yes
BUILD_DESKTOP=no
CREATE_PATCHES=no

# Host build (Docker is not installed in this VM)
PREFER_DOCKER=no

# China regional mirrors: kernel/firmware->tuna, u-boot->gitee,
# OCI gitballs (kernel+u-boot source)->ghcr.nju.edu.cn, github->ghproxy
REGIONAL_MIRROR=china
GHPROXY_ADDRESS=gh-proxy.com

# Keep caches across rebuilds; don't wipe work trees
CLEAN_LEVEL=""
